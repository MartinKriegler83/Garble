<style>
  :root {
    --blue: #2C3BFF;
    --blue-deep: #1B26B8;
    --white: #FFFFFF;
    --pink: #FF4FA3;
    --ink: #0E1240;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--blue);
    color: var(--white);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 500;
    font-size: 17px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

  .app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
  }

  .top { display: flex; align-items: baseline; justify-content: space-between; }
  .wordmark { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .how-btn { background: none; border: none; padding: 6px 0; opacity: .8; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }

  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 18px 0; }
  #s2 h1 { font-size: clamp(30px, 8vw, 40px); }

  h1 {
    font-size: clamp(38px, 11vw, 56px);
    font-weight: 800;
    line-height: .95;
    letter-spacing: -0.035em;
    margin: 0;
  }
  .lead { font-size: 18px; opacity: .85; margin: 0; max-width: 32ch; }

  /* record button */
  .rec-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .rec {
    width: 132px; height: 132px; border-radius: 50%;
    background: var(--white);
    border: none;
    display: grid; place-items: center;
    position: relative;
    transition: transform .12s ease;
  }
  .rec:active { transform: scale(.94); }
  .rec .core { width: 46px; height: 46px; border-radius: 50%; background: var(--pink); transition: border-radius .2s ease, transform .2s ease; }
  .rec[data-on="true"] .core { border-radius: 8px; transform: scale(.8); }
  .rec[data-on="true"]::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 3px solid var(--pink);
    animation: pulse 1.1s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.92); opacity: .9 } to { transform: scale(1.18); opacity: 0 } }
  .rec-hint { font-size: 15px; opacity: .8; min-height: 1.4em; font-variant-numeric: tabular-nums; }

  /* effects */
  .effects { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .fx {
    border: 2px solid rgba(255,255,255,.45);
    background: transparent;
    border-radius: 14px;
    padding: 11px 6px;
    text-align: center;
    line-height: 1.15;
    min-height: 46px;
  }
  .fx b { display: block; font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
  .fx span { display: none; }
  .fx[aria-pressed="true"] { background: var(--white); color: var(--blue-deep); border-color: var(--white); }

  .waves { height: 40px; display: flex; align-items: center; gap: 3px; }
  .waves i { flex: 1; background: var(--white); border-radius: 2px; min-height: 3px; opacity: .9; }

  .actions { display: flex; flex-direction: column; gap: 10px; }
  .big {
    width: 100%;
    padding: 15px 18px;
    border-radius: 18px;
    border: none;
    background: var(--pink);
    color: var(--white);
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .big.ghost { background: transparent; border: 2px solid rgba(255,255,255,.5); font-weight: 500; font-size: 17px; }
  .big.white { background: var(--white); color: var(--blue-deep); }
  .big:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; }
  .row .big { flex: 1; }

  .step-tag { font-size: 14px; opacity: .75; margin: 0; }

  .notice {
    background: rgba(14,18,64,.45);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.4;
  }
  .notice a { color: var(--white); }

  /* how-to sheet */
  .sheet {
    position: fixed; inset: 0;
    background: var(--ink);
    padding: max(24px, env(safe-area-inset-top)) 24px 40px;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
    overflow-y: auto;
    z-index: 10;
  }
  .sheet[data-open="true"] { transform: none; }
  .sheet h2 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 20px; line-height: 1; }
  .sheet ol { padding-left: 22px; margin: 0 0 26px; font-size: 18px; }
  .sheet li { margin-bottom: 12px; }
  .sheet li::marker { color: var(--pink); font-weight: 800; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <div class="top">
    <div class="wordmark">Garble <span style="font-size:12px;font-weight:500;opacity:.6">v1.0</span></div>
    <button class="how-btn" id="howOpen" data-i18n="how"></button>
  </div>

  <!-- Screen 1: record -->
  <section class="stage" id="s1">
    <h1 data-i18n="h1a"></h1>
    <p class="lead" data-i18n="lead1"></p>
    <div class="rec-wrap">
      <button class="rec" id="recBtn" data-on="false" aria-label="Aufnehmen"><span class="core"></span></button>
      <div class="rec-hint" id="recHint"></div>
    </div>
    <div class="notice hidden" id="micNotice"></div>
  </section>

  <!-- Screen 2: choose & share distorted -->
  <section class="stage hidden" id="s2">
    <p class="step-tag" id="s2tag">Aufgenommen · 0,0 s</p>
    <h1 data-i18n="h1b"></h1>
    <div class="effects" id="effects"></div>
    <div class="waves" id="waves" aria-hidden="true"></div>
    <div class="actions">
      <button class="big white" id="previewBtn" data-i18n="listen"></button>
      <button class="big" id="shareDistBtn" data-i18n="sendDist"></button>
      <button class="big ghost" id="redoBtn" data-i18n="redo"></button>
    </div>
  </section>

  <!-- Screen 3: reveal -->
  <section class="stage hidden" id="s3">
    <p class="step-tag" data-i18n="sent"></p>
    <h1 data-i18n="h1c"></h1>
    <p class="lead" data-i18n="lead3"></p>
    <div class="actions">
      <button class="big" id="shareOrigBtn" data-i18n="sendOrig"></button>
      <button class="big ghost" id="againBtn" data-i18n="again"></button>
    </div>
  </section>
</div>
<div id="err" style="position:fixed;left:12px;right:12px;bottom:12px;background:#0E1240;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;display:none;z-index:20;white-space:pre-wrap"></div>

<div class="sheet" id="howSheet" data-open="false" role="dialog" aria-label="How Garble works">
  <h2 data-i18n="howTitle"></h2>
  <ol id="howList"></ol>
  <button class="big white" id="howClose" data-i18n="gotit"></button>
</div>

  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onRecStop;
  mediaRecorder.start();
  recStart = Date.now();
  $('recBtn').dataset.on = 'true';
  recTimer = setInterval(() => {
    const s = (Date.now() - recStart) / 1000;
    $('recHint').textContent = fmt(s) + ' s · ' + T.tapStop;
    if (s >= 12) stopRec();
  }, 100);
}

function stopRec() {
  clearInterval(recTimer);
  $('recBtn').dataset.on = 'false';
  $('recHint').textContent = T.busy;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (ac) { try { ac.close(); } catch {} ac = null; }
  audioMode('playback');
}

async function onRecStop() {
  origBlob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/mp4' });
  const arr = await origBlob.arrayBuffer();
  try {
    origBuffer = await ctx().decodeAudioData(arr.slice(0));
  } catch (e) {
    $('recHint').textContent = T.cantRead;
    return;
  }
  if (origBuffer.duration < 0.4) {
    $('recHint').textContent = T.tooShort;
    return;
  }
  { let pk = 0; const d = origBuffer.getChannelData(0); for (let i = 0; i < d.length; i += 4) pk = Math.max(pk, Math.abs(d[i]));
    if (pk < 0.002) { $('recHint').textContent = T.silent; return; } }
  $('recHint').textContent = T.tapRec;
  $('s2tag').textContent = T.recorded + ' · ' + fmt(origBuffer.duration) + ' s';
  buildEffects();
  await applyFx(currentFx);
  show('s2');
}

/* ---------- effects ---------- */
function buildEffects() {
  const el = $('effects');
  el.innerHTML = '';
  FX.forEach(f => {
    const b = document.createElement('button');
    b.className = 'fx';
    b.setAttribute('aria-pressed', f.id === currentFx);
    b.innerHTML = '<b>' + f.name + '</b><span>' + f.desc + '</span>';
    b.onclick = async () => { currentFx = f.id; buildEffects(); await applyFx(f.id); };
    el.appendChild(b);
  });
}

function mono(buf) {
  const out = new Float32Array(buf.length);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) out[i] += d[i] / buf.numberOfChannels;
  }
  return out;
}

function fxShuffle(x, sr) {
  const chunk = Math.floor(sr * 0.22);
  const pieces = [];
  for (let i = 0; i < x.length; i += chunk) pieces.push(x.subarray(i, Math.min(i + chunk, x.length)));
  // keep a few pieces in place so it stays half-recognisable
  for (let i = pieces.length - 1; i > 0; i--) {
    if (Math.random() < 0.7) { const j = Math.floor(Math.random() * (i + 1)); [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; }
  }
  const out = new Float32Array(x.length);
  let p = 0;
  const fade = Math.floor(sr * 0.008);
  pieces.forEach(pc => {
    for (let i = 0; i < pc.length; i++) {
      let g = 1;
      if (i < fade) g = i / fade; else if (i > pc.length - fade) g = (pc.length - i) / fade;
      out[p + i] = pc[i] * g;
    }
    p += pc.length;
  });
  return { data: out, rate: sr };
}

function fxReverse(x, sr) { return { data: Float32Array.from(x).reverse(), rate: sr }; }

function resample(x, f) {
  const n = Math.floor(x.length / f);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = i * f, i0 = Math.floor(s), t = s - i0;
    out[i] = (x[i0] || 0) * (1 - t) + (x[i0 + 1] || 0) * t;
  }
  return out;
}
function fxSpeedy(x, sr) { return { data: resample(x, 1.7), rate: sr }; }

function fxCave(x, sr) {
  const d = Math.floor(sr * 0.27), n = x.length + Math.floor(sr * 1.3);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = (x[i] || 0) + (i >= d ? out[i - d] * 0.48 : 0);
  return { data: out, rate: sr };
}

function lowpass(x, sr, fc, passes) {
  let y = Float32Array.from(x);
  const a = Math.exp(-2 * Math.PI * fc / sr);
  for (let p = 0; p < (passes || 1); p++) { let z = 0; for (let i = 0; i < y.length; i++) { z = a * z + (1 - a) * y[i]; y[i] = z; } }
  return y;
}
function highpass(x, sr, fc) {
  const a = Math.exp(-2 * Math.PI * fc / sr);
  const y = new Float32Array(x.length); let prev = 0;
  for (let i = 0; i < x.length; i++) { y[i] = a * ((y[i - 1] || 0) + x[i] - prev); prev = x[i]; }
  return y;
}

function fxWater(x, sr) {
  const y = lowpass(x, sr, 520, 2);
  for (let i = 0; i < y.length; i++) y[i] *= 0.75 + 0.25 * Math.sin(2 * Math.PI * 4.5 * i / sr);
  return { data: y, rate: sr };
}

function fxRadio(x, sr) {
  let y = lowpass(highpass(x, sr, 350), sr, 2800, 1);
  for (let i = 0; i < y.length; i++) {
    let v = y[i] * 4; v = Math.max(-0.4, Math.min(0.4, v));
    v += (Math.random() - 0.5) * 0.10;
    if (Math.random() < 0.0015) v += (Math.random() - 0.5) * 0.9;
    y[i] = v;
  }
  return { data: y, rate: sr };
}

function fxStutter(x, sr) {
  const frame = Math.floor(sr * 0.02);
  const nF = Math.floor(x.length / frame);
  const rms = new Float32Array(nF);
  for (let f = 0; f < nF; f++) { let e = 0; for (let i = 0; i < frame; i++) { const v = x[f * frame + i]; e += v * v; } rms[f] = Math.sqrt(e / frame); }
  let peak = 0; for (let f = 0; f < nF; f++) peak = Math.max(peak, rms[f]);
  // onsets: quiet -> loud within 3 frames
  const onsets = [];
  for (let f = 3; f < nF; f++) {
    const before = Math.max(rms[f - 3], rms[f - 2]), now = rms[f];
    if (now > peak * 0.25 && before < now * 0.35) { onsets.push(f * frame); f += 12; }
  }
  const syl = Math.floor(sr * 0.11), gap = Math.floor(sr * 0.05), fade = Math.floor(sr * 0.006);
  const parts = []; let cursor = 0;
  onsets.forEach(pos => {
    if (Math.random() > 0.45) return;
    parts.push(x.subarray(cursor, pos));
    const piece = x.subarray(pos, Math.min(pos + syl, x.length));
    const reps = 3 + Math.floor(Math.random() * 3);
    for (let r = 0; r < reps; r++) { parts.push(piece); parts.push(new Float32Array(gap)); }
    cursor = pos;
  });
  parts.push(x.subarray(cursor));
  if (parts.length === 1) { // no onsets found: fall back to a couple of forced stutters
    const pos = Math.floor(x.length * 0.3), piece = x.subarray(pos, pos + syl);
    parts.length = 0; parts.push(x.subarray(0, pos));
    for (let r = 0; r < 4; r++) { parts.push(piece); parts.push(new Float32Array(gap)); }
    parts.push(x.subarray(pos));
  }
  let len = 0; parts.forEach(pc => len += pc.length);
  const out = new Float32Array(len); let p = 0;
  parts.forEach(pc => {
    for (let i = 0; i < pc.length; i++) {
      let g = 1; if (pc.length > 2 * fade) { if (i < fade) g = i / fade; else if (i > pc.length - fade) g = (pc.length - i) / fade; }
      out[p + i] = pc[i] * g;
    }
    p += pc.length;
  });
  return { data: out, rate: sr };
}

function fxDrunk(x0, sr) {
  // slur: smear consonants, add a short mushy echo
  const x = lowpass(x0, sr, 1900, 1);
  const d = Math.floor(sr * 0.016);
  for (let i = x.length - 1; i >= d; i--) x[i] = x[i] * 0.7 + x[i - d] * 0.45;
  // time-stretch without pitch change: overlap-add grains, stretch wanders 1.1–1.45
  const grain = Math.floor(sr * 0.05), hopOut = Math.floor(grain / 2);
  const win = new Float32Array(grain); for (let i = 0; i < grain; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / grain);
  const out = new Float32Array(Math.floor(x.length * 1.6) + grain);
  let inPos = 0, outPos = 0, stretch = 1.2;
  while (inPos + grain < x.length) {
    for (let i = 0; i < grain; i++) out[outPos + i] += x[Math.floor(inPos) + i] * win[i];
    outPos += hopOut;
    stretch += (Math.random() - 0.5) * 0.12; stretch = Math.max(1.08, Math.min(1.45, stretch));
    inPos += hopOut / stretch;
  }
  return { data: out.subarray(0, outPos + grain), rate: sr };
}

async function applyFx(id) {
  let fx = id;
  if (fx === 'random') { const pool = FX.map(f => f.id).filter(id => id !== 'random'); fx = pool[Math.floor(Math.random() * pool.length)]; }
  const sr = origBuffer.sampleRate;
  const x = mono(origBuffer);
  const r = ({ shuffle: fxShuffle, reverse: fxReverse, demon: fxDemon, robot: fxRobot, speedy: fxSpeedy, cave: fxCave, water: fxWater, radio: fxRadio, stutter: fxStutter, drunk: fxDrunk })[fx](x, sr);
  // normalise
  let peak = 0; for (let i = 0; i < r.data.length; i++) peak = Math.max(peak, Math.abs(r.data[i]));
  if (peak > 0) { const g = 0.9 / peak; for (let i = 0; i < r.data.length; i++) r.data[i] *= g; }
  distBuffer = ctx().createBuffer(1, r.data.length, r.rate);
  distBuffer.copyToChannel(r.data, 0);
  distBlob = toWav(r.data, r.rate);
  drawWaves(r.data);
}

function drawWaves(d) {
  const el = $('waves');
  el.innerHTML = '';
  const bars = 40, step = Math.floor(d.length / bars);
  for (let b = 0; b < bars; b++) {
    let m = 0;
    for (let i = b * step; i < (b + 1) * step; i += 8) m = Math.max(m, Math.abs(d[i] || 0));
    const i = document.createElement('i');
    i.style.height = Math.max(6, m * 100) + '%';
    el.appendChild(i);
  }
}

/* ---------- playback ---------- */
function showErr(msg) {
  const e = document.getElementById('err');
  if (!e) return;
  e.textContent = msg; e.style.display = 'block';
  clearTimeout(e._h); e._h = setTimeout(() => e.style.display = 'none', 6000);
}
window.addEventListener('error', ev => showErr('Fehler: ' + (ev.message || ev.error)));
window.addEventListener('unhandledrejection', ev => showErr('Fehler: ' + (ev.reason && ev.reason.message || ev.reason)));

let player = null, playerUrl = null;
function playBlob(blob) {
  const btn = $('previewBtn');
  if (!blob) { showErr('Keine verzerrte Aufnahme vorhanden.'); return; }
  audioMode('playback');
  if (player) { try { player.pause(); } catch {} }
  if (playerUrl) URL.revokeObjectURL(playerUrl);
  playerUrl = URL.createObjectURL(blob);
  player = new Audio();
  player.setAttribute('playsinline', '');
  player.src = playerUrl;
  btn.textContent = '▶ …';
  player.onended = () => { btn.textContent = T.listen; };
  player.onerror = () => { btn.textContent = T.listen; showErr('Player-Fehler: ' + (player.error && player.error.code)); };
  const p = player.play();
  if (p && p.catch) p.catch(err => {
    showErr('play() abgelehnt: ' + err.message + ' — versuche Web Audio');
    try {
      const src = ctx().createBufferSource();
      src.buffer = distBuffer; src.connect(ac.destination);
      src.onended = () => { btn.textContent = T.listen; };
      src.start();
    } catch (e2) { btn.textContent = T.listen; showErr('Web Audio: ' + e2.message); }
  });
}
$('previewBtn').onclick = () => playBlob(distBlob);

/* ---------- wav encoder ---------- */
function toWav(data, rate) {
  const buf = new ArrayBuffer(44 + data.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, data.length * 2, true);
  for (let i = 0; i < data.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i])) * 0x7FFF, true);
  return new Blob([buf], { type: 'audio/wav' });
}

/* ---------- sharing ---------- */
async function shareBlob(blob, name, text) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text }); return true; } catch (e) { return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  return true;
}

$('shareDistBtn').onclick = async () => {
  const ok = await shareBlob(distBlob, 'garble.wav', T.shareDist);
  if (ok) show('s3');
};
$('shareOrigBtn').onclick = async () => {
  const ext = (origBlob.type.includes('mp4') ? 'm4a' : 'webm');
  await shareBlob(origBlob, 'answer.' + ext, T.shareOrig);
};
$('redoBtn').onclick = () => show('s1');
$('againBtn').onclick = () => { show('s1'); };
</script>
